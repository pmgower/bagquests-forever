name: Bug report
description: Something in BagQuests isn't working (wrong step, tracker or pins misbehaving, Lua error).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! In game, type `/bq feedback`. A window opens with this page's link and a short report. Click the report, press Ctrl+C, and paste it below.
        The report has your level, class, race, faction, realm, settings and questline progress. It does not include your character's name.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: For example, "accepted Thoradin's Wall, then the tracker still showed the previous step".
  - type: textarea
    id: feedback
    attributes:
      label: /bq feedback output
      description: Paste the report from the `/bq feedback` window here.
      render: text
    validations:
      required: true
  - type: textarea
    id: lua-error
    attributes:
      label: Lua error (if any)
      description: If you saw a Lua error popup (or BugSack caught one), paste the full text.
      render: text
