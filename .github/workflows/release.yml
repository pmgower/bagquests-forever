# Tag a version (git tag v0.2.0 && git push --tags) to build the zip and
# upload it to CurseForge. Tags with "beta" or "alpha" upload as that type.
name: Release
on:
  push:
    tags: ["v*"]
# contents: write lets the packager create the GitHub release next to the CurseForge upload.
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/run.lua
      # The release notes are CHANGELOG.md, so it must be written for this tag.
      - name: CHANGELOG.md is for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          head -n 1 CHANGELOG.md | grep -qx "## $v" || { echo "CHANGELOG.md must start with '## $v' (release notes for this tag)"; exit 1; }
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
